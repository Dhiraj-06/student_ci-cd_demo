name: Titanic Model CI


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  test:

    name: Test Titanic Model

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Pytest
        run: |
          pytest -vpytest -v